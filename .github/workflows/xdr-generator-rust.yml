# The code generator in xdr-generator-rust/ is its own Cargo workspace, so none
# of the root-level cargo invocations in rust.yml reach it: they resolve only to
# the stellar-xdr package. The one place rust.yml does touch the generator is
# the `generate` job, via `make clean generate`, which runs `cargo run` and so
# never compiles the generator's `#[cfg(test)]` code at all. This workflow
# covers that gap by running fmt, clippy, and the tests against the generator
# workspace directly.
#
# There is no cargo-hack feature powerset here as there is in rust.yml, because
# none of the three crates in the workspace declare any features.

name: Rust (xdr-generator-rust)

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_protected && github.sha || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  MANIFEST_PATH: xdr-generator-rust/Cargo.toml

jobs:

  complete:
    if: always()
    needs: [fmt, build, test]
    runs-on: ubuntu-latest
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1

  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - run: rustup update
    - run: cargo fmt --manifest-path $MANIFEST_PATH --all --check

  build:
    strategy:
      fail-fast: false
      matrix:
        rust: [msrv, latest]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: stellar/actions/rust-cache@main
    - name: Use the minimum supported Rust version
      if: matrix.rust == 'msrv'
      run: |
        msrv="$(cargo metadata --manifest-path $MANIFEST_PATH --format-version 1 --no-deps | jq -r '.packages | map(.rust_version) | map(values) | max')"
        rustup override set $msrv
        rustup component add clippy --toolchain $msrv
    - name: Error on warnings and clippy checks
      # Only error on warnings and checks for the msrv, because new versions of
      # Rust will frequently add new warnings and checks.
      if: matrix.rust == 'msrv'
      run: echo RUSTFLAGS='-Dwarnings -Dclippy::all -Dclippy::pedantic' >> $GITHUB_ENV
    - run: rustup update
    - run: cargo version
    # --all-targets so the tests, which `make generate` never compiles, are
    # linted too.
    - run: cargo clippy --manifest-path $MANIFEST_PATH --workspace --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        rust: [msrv, latest]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: stellar/actions/rust-cache@main
    - name: Use the minimum supported Rust version
      if: matrix.rust == 'msrv'
      run: |
        msrv="$(cargo metadata --manifest-path $MANIFEST_PATH --format-version 1 --no-deps | jq -r '.packages | map(.rust_version) | map(values) | max')"
        rustup override set $msrv
    - name: Error on warnings and clippy checks
      if: matrix.rust == 'msrv'
      run: echo RUSTFLAGS='-Dwarnings -Dclippy::all -Dclippy::pedantic' >> $GITHUB_ENV
    - run: rustup update
    - run: cargo version
    - run: cargo test --manifest-path $MANIFEST_PATH --workspace
