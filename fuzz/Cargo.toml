[package]
name = "stellar-xdr-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Its own workspace root, so the fuzz targets are not built as part of the
# parent package, which does not require nightly.
[workspace]

[dependencies]
arbitrary = { version = "1.1.3", features = ["derive"] }
libfuzzer-sys = "0.4"
stellar-xdr = { path = "..", features = ["const", "arbitrary"] }

[[bin]]
name = "transaction-envelope"
path = "fuzz_targets/transaction-envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ledger-close-meta"
path = "fuzz_targets/ledger-close-meta.rs"
test = false
doc = false
bench = false
